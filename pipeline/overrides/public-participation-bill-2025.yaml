# Layout rules for the Public Participation Bill, 2025 (Kenya Law copy of a
# scanned document — text sizes vary 11–13.7pt), calibrated from `politricks probe`.
# May only move boundaries or strip running headers — never edit legal text.

# Page 1 is the Kenya Law cover sheet.
skip_pages: [1]

# Page is ~440pt wide; marginal notes are small type starting at x ≈ 340,
# while body text ends before that.
margin_x: 324

# Running header, OCR'd inconsistently: "1126 ThePublicParticipation BUI, 2025",
# "The Public Participation Bill, 2025 1127", "ThePublic Participation Bill,
# 2025 1129", sometimes with the page number on its own line.
strip_patterns:
  - '^\d{1,4}$'
  - '(?i)^(\d{3,4}\s*)?The\s*Public\s*Participation\s*B\w{1,3},?\s*2025(\s*\d{3,4})?$'

# The scan runs words together: observed as "ENACTED by the Parliament ofKenya".
start_after: 'ENACTED by the Parliament\s*of\s*Kenya'
end_before: '^MEMORANDUM OF OBJECTS AND REASONS'

# The Arrangement of Clauses (page 2) lists 1–21 ("21—Transitional provision.").
expected_clause_count: 21

# Measured (not guessed): in this scan the marginal notes are sometimes printed
# at BODY size ("Principles" is 11.5pt), so the default "small AND right" test
# misses them. And the page shifts from scan to scan: the body ends at x≈315 on
# page 7 but x≈344 on pages 6 and 8. So instead of one fixed line, each page's
# empty gutter strip between body and notes is found from where the words
# actually are, searching x = 300..370; words right of it are notes.
margin_mode: gutter
gutter_search: [300, 370]
# Real gutters here are 7.8–14pt wide; word spaces ~3pt. Anything narrower
# than 6pt is not treated as a gutter.
gutter_min: 6

# Clause 13's line reads "i 13.(1) A responsible authority..." — a scan speck
# before the number. Up to two junk characters are allowed before clause 13's
# number ONLY (named, so it can't fire anywhere else); the text is unchanged.
start_noise: [13]

# Clause headings TRANSCRIBED by hand from the bill's own Arrangement of
# Clauses (printed page 1125 = PDF page 2), because this scan's marginal-note
# text is garbled (e.g. "oeveiopmer^tof specificguidelines forpubii 1C").
# Headings are signposts, NOT legal text — the legal text itself is never
# edited. Each clause gets heading_source "transcribed" in the data, and anyone
# can check these against PDF page 2. Transcribed 2026-09-28 (learner-approved).
heading_transcriptions:
  c1: "Short title."
  c2: "Interpretation."
  c3: "Object of the Act."
  c4: "Application of the Act."
  c5: "Principles of public participation."
  c6: "Responsible authorities in public participation."
  c7: "Considerations in undertaking public participation."
  c8: "Notice for public participation."
  c9: "Modes of notifying the public."
  c10: "Submissions during public participation."
  c11: "Reasonable time."
  c12: "Processing of responses."
  c13: "Access to public participation processes."
  c14: "Access to documents."
  c15: "Conduct in a forum of public participation."
  c16: "Development of specific guidelines for public participation."
  c17: "Publication of specific public participation guidelines."
  c18: "Public participation by Parliament."
  c19: "Certain information not to be disclosed."
  c20: "General penalty."
  c21: "Transitional provision."
