  # (2026 table, row 5, read 2026-10-23). PDF text layer 14/14 pages; the only
  # 2026 county bill with a text layer (the other four are scans). The row
  # reads: Bill No. 7 of 2026; Gazette No. 10 of 2026; 1st, 2nd and 3rd Read
  # all 28th July, 2026; Passed 28th July, 2026; Assent 31st July, 2026;
  # Remarks "Published".
  title: "The Nairobi City County Appropriation Bill, 2026"
  chamber: county
  kind: bill
  status: passed
  stage: "Passed by the Nairobi City County Assembly on 28 July 2026 (all three readings the same day); assent recorded 31 July 2026"
  stage_checked_at: "2026-10-23"
  sources:
    - label: "The Nairobi City County Appropriation Bill 2026 (Assembly Bill No. 7 of 2026)"
