# The registry of bills PoliTricks knows about, and where their OFFICIAL
# documents live. `politricks fetch <bill-id>` downloads every source listed
# here, fingerprints it, and records it in src/data/bills/<bill-id>.json.
#
# Rules:
#   - `official: true` sources must be on an allowlisted government domain
#     (see fetch.py). A third-party mirror can never become an official source.
#   - `file` is the local filename we save to, under sources/<bill-id>/.
#     We never derive it from the URL (URLs contain spaces, commas, brackets).

finance-act-2026:
  # Build finding (2026-09-25): every official copy of the Finance BILL 2026
  # (parliament.go.ke original and "Compressed Copy") is a scan with no text
  # layer, and Kenya Law does not host the Bill. The learner chose to demo the
  # Finance ACT 2026 instead: official, on Kenya Law, with a text layer.
  title: "The Finance Act, 2026"
  chamber: national
  kind: bill
  status: passed
  stage: "Law: assented 23 June 2026 (Act No. 19 of 2026)"
  stage_checked_at: "2026-09-25"
  sources:
    - label: "Finance Act, 2026 (Act No. 19 of 2026)"
      url: "https://new.kenyalaw.org/akn/ke/act/2026/19/eng@2026-06-26/source.pdf"
      official: true
      file: act.pdf
      scanned: true   # text layer produced from a scan ("Date ofA ssent" etc.)

tertiary-education-bill-2026:
  # Kenya Law copy (text layer 35/35 pages). Gazetted 24 July 2026.
  title: "The Tertiary Education, Placement and Funding Bill, 2026"
  chamber: national
  kind: bill
  status: active
  # Re-checked 2026-10-19 from the National Assembly Bills Tracker "as at
  # Thursday, 8th October 2026" (row 330, NA Bill No. 49 of 2026): First
  # Reading 11/08/2026, no Second Reading date. Not on the 21 October order
  # paper. https://www.parliament.go.ke/sites/default/files/2026-10/BILLS%20TRACKER%20AS%20AT%20THURSDAY%2C%208TH%20OCTOBER%202026_2.pdf
  # And from the Education Committee chair's statement, Hansard 6 October 2026
  # (p. 6-7): committed to the Committee on First Reading; written memoranda
  # deadline extended from 24 September to Friday 2 October 2026, 5.00 p.m.;
  # the Committee is preparing its report, to be tabled for Second Reading.
  # https://www.parliament.go.ke/sites/default/files/2026-10/The%20Hansard%20-%20Tuesday,%206%20October%202026.pdf
  stage: "Before the National Assembly Education Committee, which is preparing its report for Second Reading. Public views closed 2 October 2026, 5pm"
  stage_checked_at: "2026-10-19"
  sources:
    - label: "Tertiary Education, Placement and Funding Bill, 2026 (as published, 24 Jul 2026)"
      url: "https://new.kenyalaw.org/akn/ke/bill/na/2026-07-24/the-tertiary-education-placement-and-funding-bill-2026/eng@2026-07-24/source.pdf"
      official: true
      file: bill.pdf

public-participation-bill-2025:
  # Kenya Law copy (text layer 10/10 pages). CAVEAT: this is the Bill AS FIRST
  # PUBLISHED (National Assembly Bills No. 44 of 2025, 1 Oct 2025). The Senate
  # is considering the version the National Assembly approved, which may
  # differ. The source label says so, so no one mistakes it for that text.
  title: "The Public Participation Bill, 2025"
  chamber: senate
  kind: bill
  status: active
  # Re-checked 2026-10-19 from the Senate Bills Tracker "updated as at 16th
  # October, 2026" (row 167): Second Reading 07/10/26 and 08/10/26, remarks
  # "Bill awaiting Division at Second Reading Stage".
  # https://www.parliament.go.ke/sites/default/files/2026-10/Bills%20Tracker%20updated%20as%20at%2016.10.2026.pdf
  stage: "Second Reading in the Senate (7 and 8 October 2026); the decision (Division) is still to come. Public views closed 28 September 2026, 5pm"
  stage_checked_at: "2026-10-19"
  sources:
    - label: "Public Participation Bill, 2025 (as first published, 1 Oct 2025; not the National Assembly-approved text)"
      url: "https://new.kenyalaw.org/akn/ke/bill/na/2025-10-01/the-public-participation-bill-2025/eng@2025-10-01/source.pdf"
      official: true
      file: bill.pdf
      scanned: true   # scanned paper: variable type sizes, specks read as characters
    # Slice 8 (learner's call, 2026-10-23): the National Assembly-approved text
    # is a 10-page scan with NO text layer (page 10 blank), so it can't be a
    # source of clauses. `politricks ocr` reads it with Tesseract and
    # `politricks compare` sets it beside the first-published text above. Every
    # line read from it is labelled on the site as read by OCR.
    # The label is shown to readers: no dash, say plainly it is OCR.
    - label: "Public Participation Bill, 2025 (as approved by the National Assembly, 12 Aug 2026: text read by OCR)"
      url: "https://www.parliament.go.ke/sites/default/files/2026-09/The%20Public%20Participation%20Bill%2C%202025%20%28National%20Assembly%20Bills%20No.%2044%20of%202025%29-%20as%20approved%20by%20NA%20.pdf"
      official: true
      file: approved.pdf
      ocr: true

nairobi-appropriation-bill-2026:
