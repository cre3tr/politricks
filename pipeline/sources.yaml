      official: true
      file: bill.pdf

nairobi-motion-public-infrastructure-2025:
  # A county MOTION has no clauses: its JSON holds ONE clause, the resolution
  # text, copied from the Assembly's Hansard of 3 July 2025 (pages 9-10; see
  # pipeline/overrides/nairobi-motion-public-infrastructure-2025.yaml).
  # Stage: the Assembly's motion page (Motions tracker entry, read 2026-10-23)
  # gives mover Hon. Anthony Maragu, MCA; seconder Hon. Erick Kiogora, MCA;
  # "Dates Debated and/or Concluded" 3rd July, 2025; Remarks "Approved".
  # https://nairobiassembly.go.ke/motion/restoration-of-public-infrastructure-damaged-by-public-and-private-construction-works/
  # BUT the fingerprinted Hansard of 3 July 2025 (page 12) records
  # "(Motion deferred)": the mover postponed the debate under Standing Order
  # 104 after moving it. So "approved on 3 July" is not what the Hansard says.
  # The Hansard of 24 Sept 2025 (p. 2) lists the motion as business for
  # 25 Sept 2025; no sitting from 15 Jul to 4 Dec 2025 that was searched
  # (text layers only) records the vote. Stage below states what each
  # official source says and no more. Needs the learner's decision.
  title: "Restoration of Public Infrastructure Damaged by Public and Private Construction Works"
  chamber: county
  kind: motion
  status: passed
  stage: "Listed as Approved on the Assembly's motions tracker. The Hansard of 3 July 2025 shows it was moved that day and then deferred, so the date it was approved is not confirmed"
  stage_checked_at: "2026-10-23"
  sources:
    - label: "Nairobi City County Assembly Hansard, 3 July 2025 (motion on pages 9-10)"
      url: "https://nairobiassembly.go.ke/ncca/wp-content/uploads/hansard/2025/3rd-July-2025.pdf"
      official: true
      file: hansard.pdf
