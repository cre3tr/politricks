  # [OFFICIAL] parliament.go.ke/node/26432, "SENATE INVITES PUBLIC VIEWS ON
  # THE PUBLIC PARTICIPATION BILL, 2025", posted 23 Sep 2026: "submit their
  # views to the Clerk of the Senate on or before Monday, 28th September 2026
  # at 5.00 p.m." Checked again 2026-10-23.
  deadline: 2026-09-28
  deadline_time: "5pm"
  channels:
    # [OFFICIAL] The "Submit Comments" link on this Bill's row of the Senate
    # bills page (parliament.go.ke/the-senate/house-business/bills). It loads
    # Parliament's own comment form for the Bill (HTTP 200, 2026-10-23).
    - type: portal
      value: "https://www.parliament.go.ke/contact/senate_petition?bill=The%20Public%20Participation%20Bill%2C%202025%20%28National%20Assembly%20Bills%20No.%2044%20of%202025%29%20-%20As%20approved%20by%20NA"
