  # [NEWS] Eastleigh Voice, 14 Sep 2026: "submissions must be received by
  # 5:00 p.m. on Monday, September 28, 2026."
  deadline: 2026-09-28
  deadline_time: "5pm"
  channels:
    # [NEWS] same report. The two addresses were decoded from the page's
    # email-protection markup, not read as plain text.
    - type: email
      value: "clerk.senate@parliament.go.ke (copy to senatejlahrc@parliament.go.ke)"
    - type: venue
      value: "Office of the Clerk of the Senate, Main Parliament Buildings, Nairobi"
  requirements: >-
    Written memoranda addressed to the Clerk of the Senate,
    P.O. Box 41842-00100, Nairobi, for the Standing Committee on Justice,
    Legal Affairs and Human Rights.
