[project]
name = "politricks"
version = "0.1.0"
description = "PoliTricks pipeline: fetch official Kenyan bills, fingerprint them, extract clauses word for word, and explain them."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2",
    "httpx>=0.28",
    "pyyaml>=6",
    "truststore>=0.10",
]

[project.scripts]
politricks = "politricks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["politricks"]
